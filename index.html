<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiReceipt | Welcome</title>
  <style>
    /* Background image and page layout */
    body {
      background: url('https://plus.unsplash.com/premium_photo-1661329955912-ebc4279f3b21?fm=jpg&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8YnVzaW5lc3MlMjBoYW5kc2hha2V8ZW58MHx8MHx8fDA%3D&ixlib=rb-4.1.0&q=60&w=3000')
        no-repeat center center/cover;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
      position: relative;
      overflow: hidden;
    }

    /* Optional dark overlay to make text readable */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      z-index: 0;
    }

    h1, p, button {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    button:hover {
      background-color: #218838;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Welcome to DigiReceipt</h1>
  <p>Connecting Shopkeepers and Customers — Go Paperless!</p>
    <p class="tagline">No fear of lost receipts — stay connected with me!</p>
  <button onclick="window.location.href='login.html'">Yes, Let's Start →</button>
</body>
</html>
